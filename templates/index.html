<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facial Expression Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        #video {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #000;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e1e1e1;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d1d1;
        }

        .emotion-badge {
            display: inline-block;
            padding: 8px 15px;
            background: #f0f0f0;
            border-radius: 20px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .emotion-badge.active {
            background: #667eea;
            color: white;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        #currentEmotion {
            text-align: center;
            font-size: 18px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Facial Expression Login</h1>
        <p class="subtiltle">Authenticate with your face and Expression</p>
    
        <div id="message" class="message hidden"></div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
            <label>Required Expression</label>
            <div id="emotionBadges">
                <span class="emotion-badge active" data-emotion="happy"> 😄 Happy</span>
                <span class="emotion-badge" data-emotion="surprise"> 😲 Surprise</span>
                <span class="emotion-badge" data-emotion="neutral"> 🙂 Neutral</span>
            </div>
        </div>

        <div class="form-group">
            <label>Camera Feed</label>
            <video id="video" autoplay playsinline></video>
            <div id="currentEmotion">Detecting emotion...</div>
        </div>

        <div class="button-group">
            <button id="startCamera" class="btn-secondary">Start Camera</button>
            <button id="authenticate" class="btn-primary">Authenticate</button>
        </div>

        <div class="register-link">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>

    <script>

        let stream = null;
        let selectedEmotion = 'happy';
        let videoReady = false;
        let emotionDetectionInterval = null;

        const video = document.getElementById('video');
        const usernameInput = document.getElementById('username');
        const startCameraBtn = document.getElementById('startCamera');
        const authenticationBtn = document.getElementById('authenticate')
        const currentEmotionDiv = document.getElementById('currentEmotion');
        const messageDiv = document.getElementById('message');

        console.log('DOM elements loaded:', {                      // ✅ ADDED DEBUG
        video: !!video,
        usernameInput: !!usernameInput,
        startCameraBtn: !!startCameraBtn,
        authenticateBtn: !!authenticateBtn,                    // ✅ VERIFY IT EXISTS
        currentEmotionDiv: !!currentEmotionDiv,
        messageDiv: !!messageDiv
    });


        // Emotion badge selection
        document.querySelectorAll('.emotion-badge').forEach(badge => {
            badge.addEventListener('click', function() {
                document.querySelectorAll('.emotion-badge').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedEmotion = this.getAttribute('data-emotion');
                console.log('Selected emotion:', selectedEmotion);

            });
        });

        // Start camera
        startCameraBtn.addEventListener('click', async function() {
            try {
                console.log('Starting camera...');
                startCameraBtn.disabled = true;
                startCameraBtn.textContent = 'Starting...';

                stream = await navigator.mediaDevices.getUserMedia( {
                   video: { width: 640, height: 400 } 
                });
                
                console.log('Camera stream obtained');
                video.srcObject = stream;
                
                // Wait for video metadata to load
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
                
                // Give extra time for video to stabilize
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                console.log('Video ready:', video.videoWidth, 'x', video.videoHeight);
                
                if (video.videoWidth > 0 && video.videoHeight > 0) {
                    videoReady = true;
                    authenticateBtn.disabled = false;
                    startCameraBtn.textContent = 'Camera Active ✓';
                    showMessage('Camera started! Make your expression and authenticate', 'success');
                    
                    // Start emotion detection loop
                    detectEmotionLoop();
                } else {
                    throw new Error('Video dimensions are 0');
                }
                
            } catch (error) {
                console.error('Camera error:', error);
                startCameraBtn.disabled = false;
                startCameraBtn.textContent = 'Start Camera';
                showMessage('Error accessing camera: ' + error.message, 'error');
            }
        });

        // Detect real time emotion
               // Real-time emotion detection
        function detectEmotionLoop() {
            if (!stream || !videoReady) return;
            
            currentEmotionDiv.textContent = 'Detecting emotions...';
            
            const canvas = document.createElement('canvas');
            
            // Clear any existing interval
            if (emotionDetectionInterval) {
                clearInterval(emotionDetectionInterval);
            }
            
            emotionDetectionInterval = setInterval(async () => {
                if (!stream || !videoReady) {
                    clearInterval(emotionDetectionInterval);
                    return;
                }
                
                try {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);
                    const imageData = canvas.toDataURL('image/png', 0.8);
                    
                    const response = await fetch('/api/detect_emotion', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: imageData })
                    });
                    
                    const result = await response.json();
                    if (result.success) {
                        currentEmotionDiv.textContent = `Current: ${result.emotion} ${getEmotionEmoji(result.emotion)}`;
                    } else {
                        currentEmotionDiv.textContent = 'No face detected';
                    }
                } catch (error) {
                    console.error('Emotion detection error:', error);
                }
            }, 3000); // Check every 3 seconds
        }

        // Get emoji for emotion
        function getEmotionEmoji(emotion) {
            const emojiMap = {
                'happy': '😊',
                'sad': '😢',
                'angry': '😠',
                'surprise': '😮',
                'fear': '😨',
                'disgust': '🤢',
                'neutral': '😐'
            };
            return emojiMap[emotion] || '😐';
        }

        // Authenticate
        authenticateBtn.addEventListener('click', async function() {
            console.log('Authenticate clicked');
            const username = usernameInput.value.trim();

            if (!username) {
                showMessage('Please enter your username', 'error');
                return;
            }

            if (!stream || !videoReady) {
                showMessage('Please start the camera first', 'error');
                return;
            }

            if (video.videoWidth === 0 || video.videoHeight === 0) {
                showMessage('Video not ready yet, please wait', 'error');
                return;
            }

            try {
                authenticateBtn.disabled = true;
                authenticateBtn.textContent = 'Authenticating...';
                
                console.log('Capturing image for authentication...');
                console.log('Required emotion:', selectedEmotion);

                // Capture image from video
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                const imageData = canvas.toDataURL('image/png');

                console.log('Sending authentication request...');

                const response = await fetch('/api/authenticate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        image: imageData,
                        emotion: selectedEmotion
                    })
                });

                const result = await response.json();
                console.log('Authentication result:', result);

                if (result.success) {
                    showMessage('✓ ' + result.message, 'success');
                    
                    // Stop camera
                    if (stream) {
                        stream.getTracks().forEach(track => track.stop());
                    }
                    if (emotionDetectionInterval) {
                        clearInterval(emotionDetectionInterval);
                    }
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showMessage('✗ ' + result.message, 'error');
                    authenticateBtn.disabled = false;
                    authenticateBtn.textContent = 'Authenticate';
                }
            } catch (error) {
                console.error('Authentication error:', error);
                showMessage('Authentication error: ' + error.message, 'error');
                authenticateBtn.disabled = false;
                authenticateBtn.textContent = 'Authenticate';
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            
            if (type === 'error') {
                setTimeout(() => {
                    messageDiv.classList.add('hidden');
                }, 5000);
            }
        }

        // Clean up on page leave
        window.onbeforeunload = function() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (emotionDetectionInterval) {
                clearInterval(emotionDetectionInterval);
            }
        };
        
        

        
    </script>
    
</body>
</html>
